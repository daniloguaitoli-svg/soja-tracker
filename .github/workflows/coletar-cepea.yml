# Coleta agendada dos indicadores do CEPEA.
#
# O cepea.org.br fica atrás de um desafio anti-bot da Cloudflare que barra
# servidores (as funções da Vercel recebem 403 em qualquer região), mas responde
# normalmente a partir dos runners do GitHub. Este job lê os indicadores aqui e
# versiona o resultado em server/cepea-cache.json — que o app usa como fallback
# quando a Notícias Agrícolas falha e a chamada direta ao CEPEA é bloqueada.
#
# Efeito colateral desejado: o arquivo acumula histórico. Como o indicador CEPEA
# não tem série gratuita e o /tmp da Vercel é apagado a cada cold start, esta é a
# única série dele que persiste.

name: Coletar CEPEA

on:
  schedule:
    # 12:00 e 21:00 UTC = 9h e 18h em Brasília (antes e depois do pregão).
    - cron: "0 12,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar-cepea
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # A nova tentativa abaixo espera 15 min parada; o teto evita um job pendurado.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar indicadores do CEPEA
        id: coleta
        continue-on-error: true
        run: node .github/scripts/coletar-cepea.mjs

      # O CEPEA sai do ar por alguns minutos de vez em quando (HTTP 522 entre a
      # Cloudflare e a origem — o site fora do ar, não bloqueio). Como só há duas
      # coletas por dia, perder uma abre um buraco no histórico que este arquivo
      # existe justamente para não ter. Então espera e tenta de novo, que é o que
      # se faria à mão.
      #
      # O job só fica vermelho se as DUAS tentativas falharem, e o passo de commit
      # continua valendo quando a segunda dá certo — é para isso que serve o
      # continue-on-error acima.
      - name: Nova tentativa após 15 min
        if: steps.coleta.outcome == 'failure'
        run: |
          sleep 900
          node .github/scripts/coletar-cepea.mjs

      - name: Commitar o cache atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cepea-cache.json
          git diff --staged --quiet || git commit -m "Cache CEPEA: coleta automatica dos indicadores"
          git push
